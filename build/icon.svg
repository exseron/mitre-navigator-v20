<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26304a"/>
      <stop offset="1" stop-color="#11151f"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f26368"/>
      <stop offset="1" stop-color="#d93a3f"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc24d"/>
      <stop offset="1" stop-color="#f09a12"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e8cf5"/>
      <stop offset="1" stop-color="#3e63dd"/>
    </linearGradient>
  </defs>
  <!-- macOS Big Sur ızgarası: 824px gövde, 100px kenar boşluğu -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <g transform="translate(222 232)">
    <!-- taktik başlıkları -->
    <rect x="0" y="0" width="168" height="44" rx="14" fill="#ffffff" fill-opacity=".9"/>
    <rect x="206" y="0" width="168" height="44" rx="14" fill="#ffffff" fill-opacity=".9"/>
    <rect x="412" y="0" width="168" height="44" rx="14" fill="#ffffff" fill-opacity=".9"/>
    <!-- teknik hücreleri -->
    <rect x="0" y="72" width="168" height="96" rx="18" fill="url(#red)"/>
    <rect x="0" y="190" width="168" height="96" rx="18" fill="#ffffff" fill-opacity=".14"/>
    <rect x="0" y="308" width="168" height="96" rx="18" fill="#ffffff" fill-opacity=".14"/>
    <rect x="206" y="72" width="168" height="96" rx="18" fill="#ffffff" fill-opacity=".14"/>
    <rect x="206" y="190" width="168" height="96" rx="18" fill="url(#amber)"/>
    <rect x="206" y="308" width="168" height="96" rx="18" fill="url(#red)"/>
    <rect x="412" y="72" width="168" height="96" rx="18" fill="url(#blue)"/>
    <rect x="412" y="190" width="168" height="96" rx="18" fill="#ffffff" fill-opacity=".14"/>
    <rect x="412" y="308" width="168" height="96" rx="18" fill="url(#red)"/>
    <!-- prosedür satırları -->
    <rect x="0" y="456" width="580" height="22" rx="11" fill="#ffffff" fill-opacity=".22"/>
    <rect x="0" y="500" width="400" height="22" rx="11" fill="#ffffff" fill-opacity=".14"/>
  </g>
</svg>
